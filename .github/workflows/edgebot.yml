name: edgebot

on:
  schedule:
    - cron: "0 15 * * 4"
    - cron: "0 21 * * 5"
    - cron: "0 14 * * 6"
    - cron: "0 23 * * 6"
    - cron: "0 13 * * 0"
    - cron: "0 15 * * 1"
    - cron: "0 15 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Grade finished picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m edgebot grade
      - name: Scan for edges
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m edgebot scan --sports NFL,CFB,UFC --lock-hours 30
      - name: Save results to the repo
        run: |
          git config user.name "edgebot"
          git config user.email "edgebot@users.noreply.github.com"
          git add edges.json edgebot.sqlite || true
          git commit -m "edgebot run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing changed"
          git push
